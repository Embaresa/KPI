                                                            e('div',{style:{display:'flex', alignItems:'center', gap:'8px'}},
                                                                e('div',{style:{width:'10px', height:'10px', borderRadius:'50%', background:cor, flexShrink:0}}),
                                                                e('span',{style:{fontSize:'12px', color:'var(--text-secondary)', fontWeight:'500'}}, item.operacao)
                                                            ),
                                                            e('span',{style:{fontSize:'13px', fontWeight:'700', color:tendCor}}, tendIcon || '→')
                                                        ),
                                                    e('div',{style:{position:'relative', height:'180px'}},
                                                        e('canvas',{
                                                            ref: (canvas) => {
                                                                if(!canvas) return;
                                                                if(canvas._chartInstance) canvas._chartInstance.destroy();
                                                                canvas._chartInstance = new Chart(canvas, {
                                                                    type: 'line',
                                                                    data: {
                                                                        labels: meses,
                                                                        datasets: [
                                                                            {
                                                                                label: 'T. Médio/cx (h)',
                                                                                data: tempoMedioData,
                                                                                borderColor: cor,
                                                                                borderWidth: 2.5,
                                                                                pointRadius: 4,
                                                                                pointHoverRadius: 6,
                                                                                fill: false,
                                                                                tension: 0.3,
                                                                                spanGaps: true
                                                                            },
                                                                            ...(objH ? [{
                                                                                label: 'Objetivo: ' + objH + 'h',
                                                                                data: objLine,
                                                                                borderColor: '#22c55e',
                                                                                borderWidth: 2,
                                                                                borderDash: [8,4],
                                                                                pointRadius: 0,
                                                                                fill: false,
                                                                                tension: 0,
                                                                                spanGaps: true
                                                                            }] : [])
                                                                        ]
                                                                    },
                                                                    options: {
                                                                        responsive: true,
                                                                        maintainAspectRatio: false,
                                                                        interaction: { mode:'index', intersect:false },
                                                                        plugins: {
                                                                            legend: { labels: { color:'#94a3b8', font:{size:10}, boxWidth:16, padding:8 } },
                                                                            tooltip: { callbacks: {
                                                                                label: (ctx) => ' ' + ctx.dataset.label + ': ' + (ctx.raw !== null ? ctx.raw+'h' : 'N/A')
                                                                            }}
                                                                        },
                                                                        scales: {
                                                                            x: { ticks:{ color:'#94a3b8', font:{size:9} }, grid:{ color:'rgba(148,163,184,0.06)' } },
                                                                            y: { ticks:{ color:'#94a3b8', font:{size:9}, callback: v=>parseFloat(v.toFixed(2))+'h' }, grid:{ color:'rgba(148,163,184,0.06)' } }
                                                                        }
                                                                    }
                                                                });
                                                            }
                                                        })
                                                    )
                                                );
                                            }).filter(Boolean)
                                        )
                                    );
                                })
                                ];
                            })()
                        )
                    )
                ),
                
                activeTab==='absentismo' && (() => {
                    // ---- Cálculo de absentismo ----
                    const HORAS_DIA = 8;
                    const TIPOS_ABSENTISMO = ['Falta', 'Baixa', 'Acidente']; // férias NÃO contam para taxa

                    // Normalizar tipo
                    const normTipo = (t) => {
                        const s = (t||'').toString().trim();
                        const sl = s.toLowerCase();
                        if(sl === 'ferias' || sl === 'férias') return 'Férias';
                        if(sl === 'falta') return 'Falta';
                        if(sl === 'baixa' || sl.includes('baixa')) return 'Baixa';
                        if(sl.includes('acidente')) return 'Acidente';
                        return s || 'Outro';
                    };

                    // Dias úteis entre duas datas (excl. fins de semana)
                    const diasUteis = (inicio, fim) => {
                        let count = 0;
                        const d = new Date(inicio);
                        const f = new Date(fim);
                        while(d <= f) {
                            const dow = d.getDay();
                            if(dow !== 0 && dow !== 6) count++;
                            d.setDate(d.getDate()+1);
                        }
                        return count;
                    };

                    // Expandir ausências para lista de registos com mes
                    const ausExpandidas = ausencias.map(a => {
                        const tipo = normTipo(a.tipo);
                        const ini = a.dataInicio ? new Date(a.dataInicio) : null;
                        const fim = a.dataFim && a.dataFim !== a.dataInicio ? new Date(a.dataFim) : ini;
                        if(!ini || isNaN(ini)) return null;
                        const dias = diasUteis(ini, fim||ini);
                        const mes = String(ini.getMonth()+1).padStart(2,'0') + '/' + ini.getFullYear();
                        return { ...a, tipo, dias, mes, horas: dias * HORAS_DIA };
                    }).filter(Boolean);

                    // Filtrar por ano/mês selecionado
                    const ausFiltradas = ausExpandidas.filter(a => {
                        const [mm, yyyy] = a.mes.split('/');
                        if(filtroAno && yyyy !== filtroAno) return false;
                        if(filtroMes && a.mes !== filtroMes) return false;
                        return true;
                    });

                    // Horas previstas por colaborador no período (do mapaHorasDetalhe)
                    const horasPrevistosPorColab = {};
                    mapaHorasDetalhe.forEach(r => {
                        let mesAno = r.mes.toString();
                        if(mesAno.includes('-')) { const p=mesAno.split('-'); mesAno=p[1]+'/'+p[0]; }
                        const [mm, yyyy] = mesAno.split('/');
                        if(filtroAno && yyyy !== filtroAno) return;
                        if(filtroMes && mesAno !== filtroMes) return;
                        if(!horasPrevistosPorColab[r.colaborador]) horasPrevistosPorColab[r.colaborador] = 0;
                        horasPrevistosPorColab[r.colaborador] += r.total;
                    });
                    // Fallback: usar mapaHoras agregado (minutos → horas) se não houver detalhe
                    let totalHorasPrevistas = Object.values(horasPrevistosPorColab).reduce((s,v)=>s+v,0);
                    if(totalHorasPrevistas === 0 && Object.keys(mapaHoras).length > 0) {
                        const totalMinutos = Object.entries(mapaHoras).filter(([m]) => {
                            if(!filtroAno) return true;
                            if(filtroMes) return m === filtroMes;
                            return m.endsWith('/' + filtroAno);
                        }).reduce((s,[,v]) => s + v, 0);
                        totalHorasPrevistas = totalMinutos / 60;
                    }

                    // Ausências que contam para taxa (excluindo férias)
                    const ausAbsentismo = ausFiltradas.filter(a => TIPOS_ABSENTISMO.includes(a.tipo));
                    const totalHorasAusentes = ausAbsentismo.reduce((s,a)=>s+a.horas,0);
                    const taxaAbsentismo = totalHorasPrevistas > 0 ? (totalHorasAusentes / totalHorasPrevistas * 100) : 0;

                    // Por tipo
                    const porTipo = {};
                    ausFiltradas.forEach(a => {
                        if(!porTipo[a.tipo]) porTipo[a.tipo] = { dias:0, horas:0, ocorrencias:0 };
                        porTipo[a.tipo].dias += a.dias;
                        porTipo[a.tipo].horas += a.horas;
                        porTipo[a.tipo].ocorrencias++;
                    });

                    // Por colaborador (absentismo real)
                    const porColab = {};
                    ausAbsentismo.forEach(a => {
                        if(!porColab[a.nome]) porColab[a.nome] = { dias:0, horas:0, ocorrencias:0, tipos:{} };
                        porColab[a.nome].dias += a.dias;
                        porColab[a.nome].horas += a.horas;
                        porColab[a.nome].ocorrencias++;
                        porColab[a.nome].tipos[a.tipo] = (porColab[a.nome].tipos[a.tipo]||0) + a.dias;
                    });
                    // Adicionar colaboradores sem ausências
                    Object.keys(horasPrevistosPorColab).forEach(c => {
                        if(!porColab[c]) porColab[c] = { dias:0, horas:0, ocorrencias:0, tipos:{} };
                        porColab[c].horasPrevistas = horasPrevistosPorColab[c];
                        porColab[c].taxa = horasPrevistosPorColab[c] > 0 ? (porColab[c].horas / horasPrevistosPorColab[c] * 100) : 0;
                    });
                    const colabOrdenados = Object.entries(porColab).sort((a,b)=>b[1].dias-a[1].dias);

                    // Evolução mensal
                    const evMensal = {};
                    ausExpandidas.forEach(a => {
                        if(filtroAno && !a.mes.endsWith(filtroAno)) return;
                        if(!evMensal[a.mes]) evMensal[a.mes] = { ferias:0, falta:0, baixa:0, outro:0, previstas:0 };
                        const k = a.tipo==='Férias'?'ferias':a.tipo==='Falta'?'falta':a.tipo==='Baixa'?'baixa':'outro';
                        evMensal[a.mes][k] += a.dias;
                    });
                    mapaHorasDetalhe.forEach(r => {
                        let mesAno = r.mes.toString();
                        if(mesAno.includes('-')) { const p=mesAno.split('-'); mesAno=p[1]+'/'+p[0]; }
                        if(filtroAno && !mesAno.endsWith(filtroAno)) return;
                        if(!evMensal[mesAno]) evMensal[mesAno] = { ferias:0, falta:0, baixa:0, outro:0, previstas:0 };
                        evMensal[mesAno].previstas += r.total;
                    });
                    const mesesOrdenados = Object.keys(evMensal).sort((a,b)=>{
                        const [ma,ya]=a.split('/'); const [mb,yb]=b.split('/');
                        return (parseInt(ya)*12+parseInt(ma)) - (parseInt(yb)*12+parseInt(mb));
                    });

                    const TIPO_CORES = { 'Falta':'#ef4444', 'Baixa':'#f97316', 'Acidente':'#a855f7', 'Férias':'#3b82f6', 'Outro':'#6b7280' };

                    if(!ausencias.length && !mapaHorasDetalhe.length) {
                        return e('div',{className:'section'},
                            e('div',{style:{textAlign:'center',padding:'60px 20px',color:'#64748b'}},
                                e('div',{style:{fontSize:'48px',marginBottom:'16px'}},'🏥'),
                                e('h3',{style:{color:'#94a3b8',marginBottom:'8px'}},'Sem dados de absentismo'),
                                urlConfiguracoes
                                    ? e('button',{className:'btn btn-primary',onClick:carregarConfiguracoes,disabled:isLoadingConfig,style:{marginTop:'16px'}},
                                        isLoadingConfig ? '⏳ A carregar...' : '🔄 Carregar Configurações')
                                    : e('p',null,'Configure o URL do Fluxo 2 (Configurações) nas definições ⚙️')
                            )
                        );
                    }

                    return e('div',null,
                        // Botão atualizar
                        e('div',{style:{display:'flex',justifyContent:'flex-end',marginBottom:'16px'}},
                            e('button',{className:'btn btn-secondary',onClick:carregarConfiguracoes,disabled:isLoadingConfig,style:{fontSize:'12px',padding:'6px 14px'}},
                                isLoadingConfig ? '⏳ A atualizar...' : '🔄 Atualizar Absentismo')
                        ),
                        // KPI cards
                        e('div',{className:'kpi-grid',style:{marginBottom:'24px'}},
                            e('div',{className:'kpi-card'},
                                e('div',{className:'kpi-label'},'Taxa de Absentismo'),
                                e('div',{className:'kpi-value',style:{color: taxaAbsentismo>5?'#ef4444':taxaAbsentismo>2?'#f97316':'#22c55e'}},
                                    taxaAbsentismo.toFixed(1)+'%'),
                                e('div',{className:'kpi-sub'},'Faltas + Baixas')
                            ),
                            e('div',{className:'kpi-card'},
                                e('div',{className:'kpi-label'},'Horas Ausentes'),
                                e('div',{className:'kpi-value',style:{color:'#f87171'}}, totalHorasAusentes.toFixed(0)+'h'),
                                e('div',{className:'kpi-sub'},'Faltas e baixas')
                            ),
                            e('div',{className:'kpi-card'},
                                e('div',{className:'kpi-label'},'Horas Previstas'),
                                e('div',{className:'kpi-value'}, totalHorasPrevistas.toFixed(0)+'h'),
                                e('div',{className:'kpi-sub'},'Mapa de horas')
                            ),
                            e('div',{className:'kpi-card'},
                                e('div',{className:'kpi-label'},'Ocorrências'),
                                e('div',{className:'kpi-value',style:{color:'#fb923c'}}, ausAbsentismo.length),
                                e('div',{className:'kpi-sub'},'Registos período')
                            )
                        ),

                        // Linha 1: Por tipo + Evolução mensal
                        e('div',{style:{display:'grid',gridTemplateColumns:'1fr 2fr',gap:'16px',marginBottom:'16px'}},
                            // Por tipo
                            e('div',{className:'section'},
                                e('div',{className:'section-header'},e('h3',{className:'section-title'},'📊 Por Tipo de Ausência')),
                                e('table',{style:{width:'100%',borderCollapse:'collapse'}},
                                    e('thead',null,e('tr',null,
                                        ['Tipo','Ocorr.','Dias','Horas'].map(h=>e('th',{key:h,style:{textAlign:h==='Tipo'?'left':'right',padding:'8px',color:'#64748b',fontSize:'12px',borderBottom:'1px solid #1e293b'}},h))
                                    )),
                                    e('tbody',null,
                                        Object.entries(porTipo).sort((a,b)=>b[1].dias-a[1].dias).map(([tipo,d])=>
                                            e('tr',{key:tipo,style:{borderBottom:'1px solid #0f172a'}},
                                                e('td',{style:{padding:'8px',display:'flex',alignItems:'center',gap:'8px'}},
                                                    e('span',{style:{width:'10px',height:'10px',borderRadius:'50%',background:TIPO_CORES[tipo]||'#6b7280',display:'inline-block'}}),
                                                    e('span',{style:{color:'#e2e8f0',fontSize:'13px'}},tipo)
                                                ),
                                                e('td',{style:{textAlign:'right',padding:'8px',color:'#94a3b8',fontSize:'13px'}},d.ocorrencias),
                                                e('td',{style:{textAlign:'right',padding:'8px',color:'#94a3b8',fontSize:'13px'}},d.dias),
                                                e('td',{style:{textAlign:'right',padding:'8px',color:'#cbd5e1',fontSize:'13px',fontWeight:'600'}},d.horas+'h')
                                            )
                                        )
                                    )
                                )
                            ),

                            // Evolução mensal
                            e('div',{className:'section'},
                                e('div',{className:'section-header'},e('h3',{className:'section-title'},'📈 Evolução Mensal')),
                                mesesOrdenados.length === 0 ?
                                    e('p',{style:{color:'#64748b',textAlign:'center',padding:'20px'}},'Sem dados') :
                                e('div',{style:{overflowX:'auto'}},
                                    e('table',{style:{width:'100%',borderCollapse:'collapse',minWidth:'400px'}},
                                        e('thead',null,e('tr',null,
                                            ['Mês','Férias','Falta','Baixa','Outro','Taxa %'].map(h=>e('th',{key:h,style:{textAlign:h==='Mês'?'left':'right',padding:'8px',color:'#64748b',fontSize:'12px',borderBottom:'1px solid #1e293b'}},h))
                                        )),
                                        e('tbody',null,
                                            mesesOrdenados.map(mes => {
                                                const d = evMensal[mes];
                                                const horasAus = (d.falta + d.baixa + d.outro) * HORAS_DIA;
                                                const taxa = d.previstas > 0 ? (horasAus / d.previstas * 100) : 0;
                                                return e('tr',{key:mes,style:{borderBottom:'1px solid #0f172a'}},
                                                    e('td',{style:{padding:'8px',color:'#e2e8f0',fontSize:'13px',fontWeight:'600'}},mes),
                                                    e('td',{style:{textAlign:'right',padding:'8px',color:'#3b82f6',fontSize:'13px'}},d.ferias>0?d.ferias+'d':'—'),
                                                    e('td',{style:{textAlign:'right',padding:'8px',color:'#ef4444',fontSize:'13px',fontWeight:d.falta>0?'600':'400'}},d.falta>0?d.falta+'d':'—'),
                                                    e('td',{style:{textAlign:'right',padding:'8px',color:'#f97316',fontSize:'13px',fontWeight:d.baixa>0?'600':'400'}},d.baixa>0?d.baixa+'d':'—'),
                                                    e('td',{style:{textAlign:'right',padding:'8px',color:'#6b7280',fontSize:'13px'}},d.outro>0?d.outro+'d':'—'),
                                                    e('td',{style:{textAlign:'right',padding:'8px'}},
                                                        e('span',{style:{
                                                            color: taxa>5?'#ef4444':taxa>2?'#f97316':'#22c55e',
                                                            fontWeight:'600', fontSize:'13px'
                                                        }}, taxa > 0 ? taxa.toFixed(1)+'%' : '—')
                                                    )
                                                );
                                            })
                                        )
                                    )
                                )
                            )
                        ),

                        // Tabela por colaborador
                        e('div',{className:'section'},
                            e('div',{className:'section-header'},e('h3',{className:'section-title'},'👤 Faltas por Colaborador')),
                            e('div',{style:{overflowX:'auto'}},
                                e('table',{style:{width:'100%',borderCollapse:'collapse'}},
                                    e('thead',null,e('tr',null,
                                        ['Colaborador','Ocorr.','Dias','Horas Ausentes','Horas Previstas','Taxa','Tipos'].map(h=>
                                            e('th',{key:h,style:{textAlign:h==='Colaborador'||h==='Tipos'?'left':'right',padding:'10px 8px',color:'#64748b',fontSize:'12px',borderBottom:'1px solid #1e293b'}},h)
                                        )
                                    )),
                                    e('tbody',null,
                                        colabOrdenados.map(([nome,d])=>
                                            e('tr',{key:nome,style:{borderBottom:'1px solid #0f172a'}},
                                                e('td',{style:{padding:'10px 8px',color:'#e2e8f0',fontSize:'13px'}},nome),
                                                e('td',{style:{textAlign:'right',padding:'10px 8px',color:'#94a3b8',fontSize:'13px'}},d.ocorrencias||0),
                                                e('td',{style:{textAlign:'right',padding:'10px 8px',color:'#cbd5e1',fontSize:'13px',fontWeight:'600'}},d.dias||0),
                                                e('td',{style:{textAlign:'right',padding:'10px 8px',color:'#f87171',fontSize:'13px'}},d.horas>0?d.horas+'h':'—'),
                                                e('td',{style:{textAlign:'right',padding:'10px 8px',color:'#94a3b8',fontSize:'13px'}},d.horasPrevistas?(d.horasPrevistas.toFixed(0)+'h'):'—'),
                                                e('td',{style:{textAlign:'right',padding:'10px 8px'}},
                                                    d.taxa > 0 ? e('span',{style:{
                                                        background: d.taxa>5?'rgba(239,68,68,0.15)':d.taxa>2?'rgba(249,115,22,0.15)':'rgba(34,197,94,0.15)',
                                                        color: d.taxa>5?'#ef4444':d.taxa>2?'#f97316':'#22c55e',
                                                        padding:'2px 8px', borderRadius:'12px', fontSize:'12px', fontWeight:'600'
                                                    }}, d.taxa.toFixed(1)+'%') : e('span',{style:{color:'#22c55e',fontSize:'12px'}},'0%')
                                                ),
                                                e('td',{style:{padding:'10px 8px'}},
                                                    e('div',{style:{display:'flex',gap:'4px',flexWrap:'wrap'}},
                                                        Object.entries(d.tipos).map(([tipo,dias])=>
                                                            e('span',{key:tipo,style:{
                                                                background:`${TIPO_CORES[tipo]||'#6b7280'}22`,
                                                                color: TIPO_CORES[tipo]||'#6b7280',
                                                                padding:'1px 6px',borderRadius:'8px',fontSize:'11px'
                                                            }},tipo+' '+dias+'d')
                                                        )
                                                    )
                                                )
                                            )
                                        )
                                    )
                                )
                            )
                        )
                    );
                })(),


            );
        }
        
        ReactDOM.render(e(App), document.getElementById('root'));
    </script>
    <script>
        // Service Worker: força atualização e limpa caches antigos
        if('serviceWorker' in navigator) {
            const SW_VERSION = '2026-03-13-v1';
            const swCode = `
                const CACHE = 'kpi-embaresa-${SW_VERSION}';
                self.addEventListener('install', e => {
                    self.skipWaiting();
                });
                self.addEventListener('activate', e => {
                    e.waitUntil(
                        caches.keys().then(keys => Promise.all(
                            keys.filter(k => k !== CACHE).map(k => caches.delete(k))
                        )).then(() => self.clients.claim())
                    );
                });
                self.addEventListener('fetch', e => {
                    // Network first - nunca servir cache para o HTML principal
                    e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                });
            `.replace('${SW_VERSION}', SW_VERSION);
            
            const blob = new Blob([swCode], {type: 'application/javascript'});
            const swUrl = URL.createObjectURL(blob);
            
            navigator.serviceWorker.register(swUrl).then(reg => {
                reg.update(); // Força verificação de atualização
            }).catch(err => console.log('SW:', err));
        }
    </script>
